                    </div>

            </div>
    </div>

    <script>
        /**
         * Converts a date string into a relative human-readable format.
         */
        function timeAgo(dateParam) {
            const date = new Date(dateParam);
            const seconds = Math.round((new Date() - date) / 1000);
            const days = Math.round(seconds / 86400);
            
            if (days < 1)   return "TODAY";
            if (days < 7)   return `${days} DAYS AGO`;
            if (days < 30)  return `${Math.round(days / 7)} WEEKS AGO`;
            if (days < 365) return `${Math.round(days / 30)} MONTHS AGO`;
            return `${Math.round(days / 365)} YEARS AGO`;
        }

        /**
         * Switches between 'cards' (list) and 'grid' view modes.
         */
        function setView(view) {
            const container = document.getElementById("category-container");
            const btnCards = document.getElementById("btn-cards");
            const btnGrid = document.getElementById("btn-grid");

            // Reset UI state
            btnCards.classList.remove("active");
            btnGrid.classList.remove("active");
            
            // Apply new view
            container.className = "view-" + view;
            document.getElementById("btn-" + view).classList.add("active");
            
            localStorage.setItem("preferredView", view);
        }

        /**
         * Sorts the entry-item elements based on the selected dropdown value.
         */
        function sortEntries() {
            const container = document.getElementById("category-container");
            const entries = Array.from(container.getElementsByClassName("entry-item"));
            const sortBy = document.getElementById("sort-select").value;

            entries.sort((a, b) => {
                switch(sortBy) {
                    case 'alpha':
                        return a.dataset.title.localeCompare(b.dataset.title);
                    case 'date-upd':
                        return new Date(b.dataset.upd) - new Date(a.dataset.upd);
                    default: // 'date-pub'
                        return new Date(b.dataset.pub) - new Date(a.dataset.pub);
                }
            });

            // Re-append to DOM in new order
            entries.forEach(el => container.appendChild(el));
            localStorage.setItem("preferredSort", sortBy);
        }

        /**
         * App Initialization: Restores user preferences and transforms dates.
         */
        document.addEventListener("DOMContentLoaded", () => {
            // Restore View Preference
            const savedView = localStorage.getItem("preferredView") || "cards";
            setView(savedView);
            
            // Restore Sort Preference
            const savedSort = localStorage.getItem("preferredSort") || "date-pub";
            const sortSelect = document.getElementById("sort-select");
            sortSelect.value = savedSort;
            sortEntries();
            
            // Transform Update Tags to Relative Time
            document.querySelectorAll(".update-tag").forEach(tag => {
                const rawDate = tag.getAttribute("data-date");
                if (rawDate) {
                    tag.innerText = `UPDATED ${timeAgo(rawDate)}`;
                }
            });
        });
    </script>
